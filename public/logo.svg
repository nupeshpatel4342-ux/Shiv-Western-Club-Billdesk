<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Dark background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>

    <!-- Gold gradient for 3D effect -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d080"/>
      <stop offset="20%" stop-color="#c9a84c"/>
      <stop offset="50%" stop-color="#e8c96a"/>
      <stop offset="70%" stop-color="#a07828"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>

    <!-- Navy gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#253560"/>
      <stop offset="50%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#0f1a30"/>
    </linearGradient>

    <!-- Gold stroke gradient -->
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d080"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#906020"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow filter for gold -->
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Texture noise filter for background -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" rx="16"/>
  <!-- Subtle texture overlay -->
  <rect width="500" height="500" fill="url(#bgGrad)" rx="16" filter="url(#noise)" opacity="0.15"/>

  <!-- ========== CROWN ========== -->
  <g id="crown" filter="url(#shadow)">
    <!-- Crown base band -->
    <path d="M155,215 L345,215 L345,228 L155,228 Z" fill="url(#goldGrad)" stroke="url(#goldStroke)" stroke-width="0.5"/>

    <!-- Crown left spike -->
    <path d="M155,215 L140,160 L175,195 L210,140 L230,215 Z"
          fill="url(#navyGrad)" stroke="url(#goldStroke)" stroke-width="2.5"/>
    <path d="M155,215 L140,160 L175,195 L210,140 L230,215 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Crown center spike (tallest) -->
    <path d="M230,215 L240,155 L250,130 L260,155 L270,215 Z"
          fill="url(#navyGrad)" stroke="url(#goldStroke)" stroke-width="2.5"/>
    <path d="M230,215 L240,155 L250,130 L260,155 L270,215 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Crown right spike -->
    <path d="M270,215 L290,140 L325,195 L360,160 L345,215 Z"
          fill="url(#navyGrad)" stroke="url(#goldStroke)" stroke-width="2.5"/>
    <path d="M270,215 L290,140 L325,195 L360,160 L345,215 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Crown diamond center top -->
    <polygon points="250,118 260,130 250,142 240,130"
             fill="url(#goldGrad)" stroke="#906020" stroke-width="1"/>

    <!-- Crown center interlace detail -->
    <path d="M233,215 L245,175 L250,162 L255,175 L267,215"
          fill="url(#goldGrad)" stroke="#a07828" stroke-width="0.5"/>

    <!-- Small diamond left spike -->
    <polygon points="175,182 181,192 175,200 169,192"
             fill="url(#goldGrad)" stroke="#906020" stroke-width="1"/>

    <!-- Small diamond right spike -->
    <polygon points="325,182 331,192 325,200 319,192"
             fill="url(#goldGrad)" stroke="#906020" stroke-width="1"/>

    <!-- Crown V notch center base -->
    <path d="M230,228 L250,210 L270,228" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>

  <!-- ========== SWC MONOGRAM ========== -->
  <g id="monogram" filter="url(#shadow)">

    <!-- === C letter (rightmost, large circle arc) === -->
    <path d="M370,255 A105,120 0 1 0 370,390"
          fill="none" stroke="url(#navyGrad)" stroke-width="38"/>
    <path d="M370,255 A105,120 0 1 0 370,390"
          fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
    <!-- C inner line -->
    <path d="M350,270 A80,95 0 1 0 350,375"
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

    <!-- === S letter (leftmost, elegant S curve) === -->
    <!-- S body - navy fill with gold outline -->
    <path d="M175,255 C135,255 120,275 130,305 C140,330 185,330 190,355 C195,380 175,398 145,395"
          fill="none" stroke="url(#navyGrad)" stroke-width="38" stroke-linecap="round"/>
    <path d="M175,255 C135,255 120,275 130,305 C140,330 185,330 190,355 C195,380 175,398 145,395"
          fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- S inner highlight line -->
    <path d="M168,262 C140,262 128,278 136,304 C144,326 182,328 186,352 C190,374 174,390 152,390"
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>

    <!-- S top serif -->
    <path d="M155,252 L200,252" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M125,392 L168,392" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- === W letter (center, large) === -->
    <!-- W navy fill body -->
    <path d="M200,240 L230,370 L250,300 L270,370 L300,240"
          fill="none" stroke="url(#navyGrad)" stroke-width="40" stroke-linejoin="miter" stroke-linecap="round"/>
    <!-- W gold outline -->
    <path d="M200,240 L230,370 L250,300 L270,370 L300,240"
          fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="miter" stroke-linecap="round"/>
    <!-- W inner highlight -->
    <path d="M204,248 L232,366 L250,307 L268,366 L296,248"
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>

    <!-- W top cross serif line -->
    <path d="M185,240 L315,240" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- === Vertical slash/divider through W (J-like stroke) === -->
    <path d="M250,235 L250,400"
          fill="none" stroke="url(#navyGrad)" stroke-width="20"/>
    <path d="M250,235 L250,400"
          fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Bottom curl of J/S divider -->
    <path d="M250,400 C250,415 235,422 225,415"
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  </g>

  <!-- ========== OUTER RING (subtle) ========== -->
  <circle cx="250" cy="330" r="165" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.25"/>
</svg>
